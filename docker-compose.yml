services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.vercel
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_jwt_access_secret_key_change_in_production_32char}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      VISION_PROVIDER: ${VISION_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      VISION_MODEL: ${VISION_MODEL:-typesafe-ai/jev-1.14.0}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      UPLOAD_DIR: uploads
    ports:
      - "4000:4000"
    volumes:
      - api_uploads:/app/uploads

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.vercel
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      INTERNAL_API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  api_uploads:
